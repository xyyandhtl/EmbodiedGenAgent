range_sensor: "lidar"

ros:
  use_compressed_topic: true
  ros_rate: 10
  sync_threshold: 0.1
  topics:
    rgb: /camera/image/compressed
    lidar: /livox/lidar
    # odom_lidar: /Odometry
    odom_lidar: /lio/odometry
    # odom_camera: /camera/pose
    # depth: /camera/depth/image_raw
    # camera_info: /camera_info
  pubs:
    cmd_vel: /cmd_vel
    nav_pose: /nav_pose
    enum_cmd: /enum_cmd

camera:
  fov_x_deg: 90.0
  aspect: 1.3333333333
  near_dist: 2.0

lidar:
  min_thr: 0.3
  max_thr: 20.0

use_rviz: true
